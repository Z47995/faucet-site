<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter | Convert JPG, PNG to PDF Free</title>
    <!-- jsPDF Library for Client-Side PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f12; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #1a1a24; padding: 25px; border-radius: 16px; border: 1px solid #2a2a3a; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; margin-bottom: 10px; color: #00ff88; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }

        .ad-box { 
            background: #252535; 
            border: 1px dashed #444; 
            padding: 10px; 
            margin: 20px 0; 
            border-radius: 10px; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 250px;
        }

        .upload-card { background: #12121a; padding: 25px; border-radius: 12px; border: 2px dashed #00ff88; margin: 15px 0; cursor: pointer; transition: 0.2s; }
        .upload-card:hover { background: #181824; }
        .file-input { display: none; }

        .btn-action {
            width: 100%;
            background: #00ff88;
            color: #000;
            font-weight: bold;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-action:hover:not(:disabled) { background: #00cc6d; }

        #previewList { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .img-preview { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #00ff88; }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 Image to PDF Converter</h1>
    <p>Select images from your device and convert them instantly into a professional A4 PDF document.</p>

    <!-- Top A-Ads Banner -->
    <div class="ad-box">
        <iframe data-aa='2460951' src='//ad.a-ads.com/2460951?size=300x250' style='width:100%; height:250px; border:0; padding:0; overflow:hidden; background-color: transparent;'></iframe>
    </div>

    <!-- Image Upload Area -->
    <div class="upload-card" onclick="document.getElementById('imgInput').click()">
        <p style="margin: 0; font-size: 16px; color: #fff;">📁 Click here to select images</p>
        <span style="font-size: 12px; color: #888;">(You can select multiple images)</span>
        <input type="file" id="imgInput" class="file-input" accept="image/*" multiple onchange="handleFiles(this.files)">
    </div>

    <div id="previewList"></div>

    <button id="convertBtn" class="btn-action" onclick="convertToPDF()" disabled>Convert & Download PDF ⬇️</button>

    <!-- Bottom A-Ads Banner -->
    <div class="ad-box">
        <iframe data-aa='2460951' src='//ad.a-ads.com/2460951?size=300x250' style='width:100%; height:250px; border:0; padding:0; overflow:hidden; background-color: transparent;'></iframe>
    </div>
</div>

<script>
    let selectedFiles = [];

    function handleFiles(files) {
        selectedFiles = Array.from(files);
        const previewContainer = document.getElementById('previewList');
        previewContainer.innerHTML = '';

        if (selectedFiles.length > 0) {
            document.getElementById('convertBtn').disabled = false;
            selectedFiles.forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'img-preview';
                previewContainer.appendChild(img);
            });
        } else {
            document.getElementById('convertBtn').disabled = true;
        }
    }

    async function convertToPDF() {
        if (selectedFiles.length === 0) return;

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
        });

        const pageWidth = 210; // A4 width in mm
        const pageHeight = 297; // A4 height in mm
        const margin = 10; // 10mm margin

        for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            const imgData = await readFileAsDataURL(file);

            if (i > 0) pdf.addPage();

            // Load image to get its natural dimensions
            const imgDimensions = await getImageDimensions(imgData);
            let imgWidth = imgDimensions.width;
            let imgHeight = imgDimensions.height;

            const maxWidth = pageWidth - (margin * 2);
            const maxHeight = pageHeight - (margin * 2);

            let ratio = Math.min(maxWidth / imgWidth, maxHeight / imgHeight);
            let finalWidth = imgWidth * ratio;
            let finalHeight = imgHeight * ratio;

            let x = (pageWidth - finalWidth) / 2;
            let y = (pageHeight - finalHeight) / 2;

            pdf.addImage(imgData, 'JPEG', x, y, finalWidth, finalHeight);
        }

        pdf.save('professional-converted.pdf');
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function getImageDimensions(url) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve({ width: img.width, height: img.height });
            img.onerror = reject;
            img.src = url;
        });
    }
</script>

</body>
</html>
