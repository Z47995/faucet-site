<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Crypto Faucet | Earn Rewards</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f0f12; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 450px; margin: 0 auto; background: #1a1a24; padding: 20px; border-radius: 16px; border: 1px solid #2a2a3a; }
        .ad-box { background: #252535; border: 1px dashed #444; padding: 15px; margin: 15px 0; border-radius: 8px; color: #888; font-size: 13px; }
        .captcha-card { background: #12121a; padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px solid #333; }
        .icons-grid { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .icon-btn { background: #252535; border: 2px solid #3a3a50; border-radius: 8px; width: 50px; height: 50px; cursor: pointer; font-size: 22px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { border-color: #00ff88; background: #2a3a30; }
        .btn-claim { width: 100%; background: #00ff88; color: #000; font-weight: bold; padding: 14px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; opacity: 0.5; pointer-events: none; }
        .btn-claim.active { opacity: 1; pointer-events: auto; }
        .status-msg { margin-top: 15px; color: #00ff88; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎁 Crypto Faucet</h2>
    <p>Claim your free crypto rewards instantly</p>

    <!-- Top Ad Box -->
    <div class="ad-box">
        [Top Ad Banner Space: A-Ads / Monetag]
    </div>

    <!-- Dynamic Anti-Bot Captcha -->
    <div class="captcha-card">
        <p style="font-size: 14px; color: #ccc;">Security Check: Select matching icon</p>
        <div id="target-icon" style="font-size: 32px; margin: 10px 0;">🔄</div>
        
        <div class="icons-grid" id="iconsContainer">
            <!-- Dynamic buttons will load here -->
        </div>
    </div>

    <!-- Bottom Ad Box -->
    <div class="ad-box">
        [Bottom Ad Banner Space: A-Ads / Monetag]
    </div>

    <button id="claimBtn" class="btn-claim" onclick="claimReward()">Claim Reward 💰</button>
    <div id="status" class="status-msg">Successfully claimed! +0.0001 USDT added.</div>
</div>

<script>
    const pool = ['🚀', '⭐', '🔥', '💎', '🛡️', '⚡', '🌀', '🔮'];
    let correctIcon = '';
    let isHuman = false;

    function generateCaptcha() {
        isHuman = false;
        document.getElementById('claimBtn').classList.remove('active');
        document.getElementById('status').style.display = 'none';

        // Shuffle pool and pick target
        let shuffled = [...pool].sort(() => 0.5 - Math.random());
        correctIcon = shuffled[0];
        document.getElementById('target-iconinnerText' || 'target-icon').innerText = correctIcon;

        // Pick 4 random options including the correct one
        let options = shuffled.slice(0, 4).sort(() => 0.5 - Math.random());
        
        let container = document.getElementById('iconsContainer');
        container.innerHTML = '';
        
        options.forEach(icon => {
            let btn = document.createElement('button');
            btn.className = 'icon-btn';
            btn.innerText = icon;
            btn.onclick = () => checkCaptcha(icon);
            container.appendChild(btn);
        });
    }

    function checkCaptcha(selectedIcon) {
        if(selectedIcon === correctIcon) {
            isHuman = true;
            document.getElementById('claimBtn').classList.add('active');
            alert('Verification successful! Click claim below.');
        } else {
            alert('Wrong icon! Captcha reloaded for security.');
            generateCaptcha();
        }
    }

    function claimReward() {
        if(isHuman) {
            document.getElementById('status').style.display = 'block';
            document.getElementById('claimBtn').classList.remove('active');
            // Reset captcha for next round after 2 seconds
            setTimeout(generateCaptcha, 2000);
        }
    }

    // Initialize on load
    window.onload = generateCaptcha;
</script>

</body>
</html>
