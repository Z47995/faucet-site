<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Faucet | Earn Free Rewards</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f0f12; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 480px; margin: 0 auto; background: #1a1a24; padding: 20px; border-radius: 16px; border: 1px solid #2a2a3a; }
        
        .ad-box { 
            background: #252535; 
            border: 1px dashed #444; 
            padding: 25px 10px; 
            margin: 20px 0; 
            border-radius: 10px; 
            color: #aaa; 
            font-size: 14px; 
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .captcha-card { background: #12121a; padding: 20px; border-radius: 12px; margin: 15px 0; border: 1px solid #333; }
        
        .secure-code-box {
            background: #000;
            color: #00ff88;
            font-family: monospace;
            font-size: 28px;
            letter-spacing: 6px;
            padding: 14px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px dashed #00ff88;
            user-select: none;
            filter: drop-shadow(0 0 2px rgba(0,255,136,0.5));
            text-shadow: 2px 2px 4px rgba(255,0,0,0.3);
        }
        
        .captcha-input {
            width: 85%;
            padding: 12px;
            background: #252535;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            margin-top: 10px;
            outline: none;
        }
        .captcha-input:focus { border-color: #00ff88; }

        .btn-verify {
            background: #2d2d3f;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 6px;
            margin-top: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-verify:hover { background: #3d3d5c; border-color: #00ff88; }

        .btn-claim { 
            width: 100%; 
            background: #00ff88; 
            color: #000; 
            font-weight: bold; 
            padding: 16px; 
            border: none; 
            border-radius: 10px; 
            font-size: 18px; 
            cursor: pointer; 
            opacity: 0.4; 
            pointer-events: none; 
            margin-top: 10px; 
            transition: 0.2s;
        }
        .btn-claim.active { opacity: 1; pointer-events: auto; }
        .btn-claim.active:hover { background: #00cc6d; }
        .status-msg { margin-top: 15px; color: #00ff88; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>💰 Crypto Faucet</h2>
    <p style="color: #aaa; font-size: 14px;">Earn free crypto rewards every 5 minutes</p>

    <!-- Top Ad Banner Space -->
    <div class="ad-box">
        [Top Banner Ad Space: A-Ads / Monetag]
    </div>

    <!-- Security Captcha -->
    <div class="captcha-card">
        <p style="font-size: 13px; color: #ccc;">Security Check: Enter the exact code shown below</p>
        
        <div id="captchaCode" class="secure-code-box">Loading...</div>
        
        <input type="text" id="userInput" class="captcha-input" placeholder="Enter security code..." autocomplete="off">
        <br>
        <button class="btn-verify" onclick="verifyCaptcha()">Verify Human</button>
    </div>

    <!-- Bottom Ad Banner Space -->
    <div class="ad-box">
        [Bottom Banner Ad Space: A-Ads / Monetag]
    </div>

    <button id="claimBtn" class="btn-claim" onclick="claimReward()">Claim Reward 💰</button>
    <div id="status" class="status-msg">Successfully claimed! +0.0001 USDT added.</div>
</div>

<script>
    let generatedString = "";

    function generateAdvancedCaptcha() {
        document.getElementById('claimBtn').classList.remove('active');
        document.getElementById('status').style.display = 'none';
        document.getElementById('userInput').value = "";

        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&";
        let result = "";
        for (let i = 0; i < 6; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        
        generatedString = result;
        document.getElementById('captchaCode').innerText = generatedString;
    }

    function verifyCaptcha() {
        let userInp = document.getElementById('userInput').value.trim();
        if (userInp === generatedString) {
            document.getElementById('claimBtn').classList.add('active');
            alert('Verification Passed! You can now click Claim Reward.');
        } else {
            alert('Incorrect code! A new security code has been generated.');
            generateAdvancedCaptcha();
        }
    }

    function claimReward() {
        document.getElementById('status').style.display = 'block';
        document.getElementById('claimBtn').classList.remove('active');
        setTimeout(generateAdvancedCaptcha, 2500);
    }

    window.onload = generateAdvancedCaptcha;
</script>

</body>
</html>
